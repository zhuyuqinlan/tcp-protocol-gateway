server:
  listen: "0.0.0.0:32920"
  read_header_timeout: 10s
  # 同时配置 tls_cert 与 tls_key 即启用 TLS（在本网关终止）。
  # TLS 按连接嗅探：HTTPS 请求与 MC 等原始 TCP 连接可共用本端口，
  # 互不影响。
  # Let's Encrypt 证书（certbot 签发后路径，域名按实际修改）。
  tls_cert: "./zhuyuqinlan.top.crt"
  tls_key: "./zhuyuqinlan.top.key"

http:
  connect_timeout: 5s
  # HTTPS 后端为自签名证书时设为 true（跳过证书校验，仅建议测试环境）。
  tls_skip_verify: false

# 默认后端 TCP 地址：连接未命中任何 HTTP 前缀路由时，
# 整条连接原始透传到该地址。
backend: "mc.lanternwaves.fun:25565"

# HTTP 路径前缀路由：连接首行是 HTTP 请求且路径命中前缀时走
# HTTP 反代，其余连接全部透传到 backend。
routes:
  http:
    "/zhuyuqinlan-files":
      backend: "127.0.0.1:8000"
      strip_prefix: true
    "/zhuyuqinlan-blog":
      backend: "127.0.0.1:8812"
      strip_prefix: true

logging:
  level: "info"
